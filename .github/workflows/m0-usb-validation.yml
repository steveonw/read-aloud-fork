name: Portable USB and real-browser validation

# Reusable full USB/Chromium validation. Normally opt-in on the stable branch.
on:
  push:
    branches: [m0/import-read-aloud-baseline, m1/tts-provider-adapter]
    paths:
      - ".github/workflows/m0-usb-validation.yml"
      - "web/**"
      - "scripts/**"
  workflow_dispatch:

concurrency:
  group: m0-full-usb-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "4.0.23"
          actions-cache-folder: emsdk-cache

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bzip2 cmake ninja-build zip

      - name: Show tool versions
        run: |
          go version
          emcc --version
          cmake --version

      - name: Make shell scripts executable
        run: |
          find scripts packaging -type f -name "*.sh" -exec chmod +x {} +

      - name: Logic and stress suites (fail fast, before the long build)
        run: |
          npm install --no-save jsdom@29.1.1
          node scripts/web_tests.js . 17391
          node scripts/stress_tests.js .

      - name: Build USB bundle
        env:
          READALOUD_TTS_THREADS: ${{ inputs.tts_threads || '4' }}
          SHERPA_TAG: v1.13.4
          READALOUD_VERSION: 0.13.0-portable-two-families
          VOICE_ID: ${{ inputs.voice_id || 'vits-piper-en_US-amy-medium' }}
          MODEL_FILENAME: ${{ inputs.model_filename || 'en_US-amy-medium.onnx' }}
          VOICE_DISPLAY_NAME: ${{ inputs.voice_display_name || '' }}
          MODEL_URL: https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/${{ inputs.voice_id || 'vits-piper-en_US-amy-medium' }}.tar.bz2
        run: ./scripts/build_all.sh

      - name: Package the Lessac High voice
        run: |
          curl -fsSL --retry 3 --retry-all-errors "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_US-lessac-high.tar.bz2" -o /tmp/lessac.tar.bz2
          mkdir -p /tmp/lessac && tar xf /tmp/lessac.tar.bz2 -C /tmp/lessac
          OUT="build/voices/lessac-high"; mkdir -p "$OUT"
          cp "$(find /tmp/lessac -name '*.onnx' -print -quit)" "$OUT/model.onnx"
          cp "$(find /tmp/lessac -name tokens.txt -print -quit)" "$OUT/tokens.txt"
          printf '{\n "schemaVersion": 1, "id": "lessac-high", "name": "Lessac High",\n "language": "English", "locale": "en-US", "engine": "sherpa-vits",\n "architecture": "vits", "model": "model.onnx", "tokens": "tokens.txt",\n "quality": "high", "quantization": "none", "sampleRate": 22050,\n "minimumRuntimeVersion": "1"\n}\n' > "$OUT/voice.json"
          cp -R build/voices "dist/ReadAloudUSB/voices" 2>/dev/null || true
          INCLUDE_DOCX="${{ github.event.inputs.include_docx || '0' }}" ./scripts/assemble_usb.sh

      - name: Launcher unit tests
        run: go test ./cmd/...

      - name: Smoke test bundle
        run: node scripts/smoke_test.js dist/ReadAloudUSB

      - name: Runtime smoke test (real browser)
        run: |
          npm install --no-save playwright@1.61.1
          npx playwright install --with-deps chromium
          node scripts/runtime_smoke.js "dist/ReadAloudUSB/shared" 17391 "dist/runtime-smoke"
          node scripts/stress_browser.js "dist/ReadAloudUSB/shared" 17391

      - name: Upload runtime smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-smoke-screens
          path: dist/runtime-smoke
          if-no-files-found: ignore

      - name: Inspect output
        run: |
          find dist/ReadAloudUSB -maxdepth 4 -type f -printf '%s %p\n' | sort -n
          sha256sum dist/ReadAloudUSB.zip

      - name: Upload completed USB ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ReadAloudUSB
          path: dist/ReadAloudUSB.zip
          if-no-files-found: error
          compression-level: 0

