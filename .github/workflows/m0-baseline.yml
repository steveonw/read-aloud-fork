name: Read-Aloud core regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Go unit and static checks
        run: |
          go test ./cmd/...
          go vet ./...
          go build -o "$RUNNER_TEMP/readaloud-launcher" ./cmd/launcher
      - name: JavaScript baseline and stress checks
        run: |
          npm install --no-save jsdom@29.1.1
          node scripts/tts_backend_tests.js .
          node scripts/web_tests.js . 17391
          node scripts/stress_tests.js .
      - name: Shell syntax
        run: |
          find scripts packaging -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
